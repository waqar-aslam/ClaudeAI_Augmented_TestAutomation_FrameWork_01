[pytest]
testpaths = tests
# e2e places a real, undeletable order on the shared backend, so it is opt-in: pytest -m e2e
addopts = -ra --alluredir=allure-results -m "not e2e"
markers =
    ui: browser-driven tests
    api: API-only tests
    e2e: end-to-end business workflows (places a real order; excluded by default, run with -m e2e)
    creates_data: may create records on the shared backend; skipped unless selected with -m creates_data
